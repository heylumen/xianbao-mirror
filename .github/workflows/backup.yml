name: 网站镜像 · 每日渲染

on:
  schedule:
    # 公开仓库（GitHub Actions 对 public 仓无限免费、不计时长，唯一硬约束=单 job 6h 超时）。
    # 目标：8/31 前爬完全站（自 8/15 起约 16 天窗口）→ 需 ≥1145 篇/天（≈2 轮/天保底）。
    # 取 3 轮/天（北京 01:00 / 09:00 / 17:00）≈ 1695 篇/天，约 8/26 前完成，留 5 天冗余至 8/31。
    # GitHub Actions cron 为 UTC，北京=UTC+8：
    #   北京 01:00 = UTC 17:00 | 北京 09:00 = UTC 01:00 | 北京 17:00 = UTC 09:00
    # 每轮实际约 3~4h（MAX_PAGES_PER_RUN=600），8h 间隔不会重叠；即便偶发超时，
    # CHECKPOINT_EVERY=120 已开检查点，仅丢最后 ≤120 页，次日续爬不重复。
    - cron: "0 17 * * *"
    - cron: "0 1 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发，便于验证与补跑

# Vercel / Netlify 通过 Git 集成读取提交的 xianbao/ 目录直接发布，
# 无需在 GitHub Actions 中部署，故只需 contents: write 提交镜像产物。
permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  mirror-backup:
    runs-on: ubuntu-latest
    # 单 job 超时兜底：默认 6h，此处显式设 360min。
    # 触发后若爬取异常卡死，到此自动终止，次日增量重跑自愈，避免一次跑空整月 Actions 额度。
    timeout-minutes: 360
    # 部署到 Vercel / Netlify 等根域名，链接需改写为 /... 而非 /<repo>/...
    # 同时开启 Vercel Web Analytics / Speed Insights 脚本注入。
    env:
      PAGES_PREFIX: "/"
      INJECT_VERCEL_ANALYTICS: "1"
      # —— 8/31 前爬完调参（公开仓无限时长，瓶颈=单 job 6h 超时）——
      # 单轮吞吐 ~565 篇（MAX_PAGES_PER_RUN=600）；3 轮/天 ≈ 1695 篇/天，
      # 18325 pending ÷ 1695 ≈ 11 天 → 约 8/26 前完成，留 5 天冗余至 8/31。
      MAX_PAGES_PER_RUN: "600"
      # 每分类每轮多翻几页列表，保证 zuankeba(未翻完) 持续发现新帖、跟得上 drain 速度
      PAGES_PER_RUN_PER_CAT: "8"
      # 检查点：每渲染 120 页提交一次，单轮 6h 超时最多丢最后 ≤120 页，绝不整轮归零
      CHECKPOINT_EVERY: "120"
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 Git 身份
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: mirror/requirements.txt

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium
          restore-keys: playwright-${{ runner.os }}-

      - name: "安装依赖（锁定版本）"
        run: |
          python -m pip install --upgrade pip
          pip install -r mirror/requirements.txt
          playwright install --with-deps chromium

      - name: "单元测试（渲染核心函数回归门禁）"
        run: python -m pytest mirror/ -q

      - name: 随机延时（仅定时触发；每轮落点在整点后 0~5min 随机，分散请求节律）
        if: github.event_name == 'schedule'
        # 公开仓无限时长，不再为控额度压窄窗口；此处仅做 0~5min 随机抖动，
        # 避免 4 轮/天在整点瞬间齐发、与源站交互节律更自然。
        run: sleep $((RANDOM % 300))

      - name: 执行网站渲染镜像（Playwright，增量 + 5 分类白名单，输出到 xianbao/）
        run: bash mirror/mirror.sh

      - name: 最终统一推送（含 checkpoint 与 mirror.sh 修复）
        if: always()
        run: |
          # render.py 的 checkpoint 已在本地 commit 但不 push，
          # 这里统一提交 mirror.sh 的后续修复并一次性 push，
          # 避免每个 checkpoint 都触发一次 Vercel 部署。
          git rm --cached xianbao/.mirror-meta.json 2>/dev/null || true
          git add xianbao/
          if ! git diff --cached --quiet; then
            DATE=$(TZ=Asia/Shanghai date +%F)
            git commit -m "mirror: $DATE"
          fi
          # 推送所有本地 commits（含 checkpoint）。即使前面步骤被取消/超时，
          # 只要有本地 commit 就尽量同步，减少进度丢失。
          git pull --rebase origin main
          git push
