name: 网站镜像 · 每日渲染

on:
  schedule:
    # 公开仓库（GitHub Actions 对 public 仓无限免费、不计时长，唯一硬约束=单 job 6h 超时）。
    #
    # 2026-09-05 调整：存量已爬取完毕（pending=0、5 个分类列表均翻到底），
    # 由「回填式全量爬取」转为「增量 + 更新式爬取」。
    # 源站新帖约 400 篇/天，而单轮配额 MAX_PAGES_PER_RUN=600 已绰绰有余，
    # 故由 3 轮/天降为 2 轮/天：
    #   · 部署次数减少 33%（每次 push 会触发一次线上发布）；
    #   · 省下的配额转投老帖复查（RECHECK_PER_RUN=200），用于同步存量文章的新评论
    #     ——此前 rechecks=0，28632 篇存量文章的新评论从未同步过。
    # GitHub Actions cron 为 UTC，北京=UTC+8：
    #   北京 01:00 = UTC 17:00 | 北京 13:00 = UTC 05:00
    # 两轮间隔 12h，远大于单轮耗时（约 3~4h），不会重叠。
    - cron: "0 17 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发，便于验证与补跑

# Vercel / Netlify 通过 Git 集成读取提交的 xianbao/ 目录直接发布，
# 无需在 GitHub Actions 中部署，故只需 contents: write 提交镜像产物。
permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  mirror-backup:
    runs-on: ubuntu-latest
    # 单 job 超时兜底：默认 6h，此处显式设 360min。
    # 触发后若爬取异常卡死，到此自动终止，次日增量重跑自愈，避免一次跑空整月 Actions 额度。
    timeout-minutes: 360
    # 部署到 Vercel / Netlify 等根域名，链接需改写为 /... 而非 /<repo>/...
    # 同时开启 Vercel Web Analytics / Speed Insights 脚本注入。
    env:
      PAGES_PREFIX: "/"
      INJECT_VERCEL_ANALYTICS: "1"
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 Git 身份
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: mirror/requirements.txt

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium
          restore-keys: playwright-${{ runner.os }}-

      - name: "安装依赖（锁定版本）"
        run: |
          python -m pip install --upgrade pip
          pip install -r mirror/requirements.txt
          playwright install --with-deps chromium

      - name: "单元测试（渲染核心函数回归门禁）"
        run: python -m pytest mirror/ -q

      - name: 随机延时（仅定时触发；每轮落点在整点后 0~5min 随机，分散请求节律）
        if: github.event_name == 'schedule'
        # 公开仓无限时长，不再为控额度压窄窗口；此处仅做 0~5min 随机抖动，
        # 避免 4 轮/天在整点瞬间齐发、与源站交互节律更自然。
        run: sleep $((RANDOM % 300))

      - name: 执行网站渲染镜像（Playwright，增量 + 5 分类白名单，输出到 xianbao/）
        env:
          # —— 存量已爬完，转为「增量新帖 + 老帖复查」——
          # 单轮吞吐上限 600 篇；源站新帖约 400 篇/天，2 轮/天已足以跟上，
          # 剩余配额由 RECHECK_PER_RUN（默认 200）用于复查老帖、同步新评论。
          # 注：这些调参仅作用于本渲染步骤，刻意不放在 job 级 env，
          # 以免泄漏到上方「单元测试」步骤、覆盖 render.py 的代码默认值
          # （如 MAX_PAGES_PER_RUN 默认 200），导致回归测试误判失败。
          MAX_PAGES_PER_RUN: "600"
          # 每分类每轮多翻几页列表，保证 zuankeba(未翻完) 持续发现新帖、跟得上 drain 速度
          PAGES_PER_RUN_PER_CAT: "8"
          # 检查点：每渲染 120 页提交一次，单轮 6h 超时最多丢最后 ≤120 页，绝不整轮归零
          CHECKPOINT_EVERY: "120"
        run: bash mirror/mirror.sh

      - name: 最终统一推送（含 checkpoint 与 mirror.sh 修复）
        if: always()
        run: |
          # render.py 的 checkpoint 已在本地 commit 但不 push，
          # 这里统一提交 mirror.sh 的后续修复并一次性 push，
          # 避免每个 checkpoint 都触发一次 Vercel 部署。
          git rm --cached xianbao/.mirror-meta.json 2>/dev/null || true
          git add xianbao/
          if ! git diff --cached --quiet; then
            DATE=$(TZ=Asia/Shanghai date +%F)
            git commit -m "mirror: $DATE"
          fi
          # 推送所有本地 commits（含 checkpoint）。即使前面步骤被取消/超时，
          # 只要有本地 commit 就尽量同步，减少进度丢失。
          git pull --rebase origin main
          git push

      - name: 失败诊断摘要（输出关键状态指标，便于排查）
        if: failure()
        run: |
          echo "::error::网站镜像任务失败，详见上方日志"
          if [ -f xianbao/.crawl-state.json ]; then
            python - <<'PYEOF'
          import json
          st = json.load(open('xianbao/.crawl-state.json', encoding='utf-8'))
          print(f"  mode={st.get('mode')}  crawled={len(st.get('crawled', {}))}"
                f"  pending={len(st.get('pending', []))}"
                f"  dead={len(st.get('dead', {}))}")
          print(f"  exhausted={st.get('category_exhausted')}")
          print(f"  backfill_complete={st.get('backfill_complete')}"
                f"  completed_at={st.get('completed_at')}")
          print(f"  stats={st.get('stats')}")
          PYEOF
          else
            echo "  未找到 .crawl-state.json（可能在渲染开始前就已失败）"
          fi
