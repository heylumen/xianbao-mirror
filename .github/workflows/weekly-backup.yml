name: 周级备份 · Release 归档

# 每周一将「整站（含 xianbao/ 镜像）」整体打包为 GitHub Release（tag 形如 backup-YYYY-Www）。
# 注意：本工作流【不再重新渲染】——镜像内容由每日 backup.yml 增量维护，这里只做周期性归档。
# 恢复粒度 = 周级；历史保留 = 全部（永久），与 qke.net 策略一致（GitHub Release assets
#   永不过期、不计入 Packages 500MB 配额、不随仓库不活动而删）。
# 分卷策略：GitHub Release 单文件上限 < 2 GiB；本工作流对【压缩后】归档测量，
#   超过 1.5 GiB 自动拆分为多卷（每卷 ≤ 1.5 GiB，稳妥低于 2 GiB 上限），
#   多卷经 `cat <tag>.tar.gz.part* > combined.tar.gz` 再 `tar -xzf` 还原。

on:
  schedule:
    - cron: "0 18 * * 1"   # 北京时间每周一 02:00（UTC 周一 18:00）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-backup
  cancel-in-progress: false

jobs:
  weekly-backup:
    runs-on: ubuntu-latest
    env:
      PAGES_PREFIX: "/"
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 整站打包（含 xianbao/，超 1.5GiB 自动分卷）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="backup-$(TZ=Asia/Shanghai date +%G-W%V)"
          TS="$(TZ=Asia/Shanghai date +%F)"
          ARCHIVE="${RUNNER_TEMP:-/tmp}/full-backup-${TAG}.tar.gz"
          # 全站整体打包（含 xianbao/ 镜像产物），排除 git 历史与缓存
          tar --exclude='.git' --exclude='__pycache__' --exclude='backups' \
              --exclude='*.pyc' --exclude='*.tar.gz' -czf "$ARCHIVE" .

          # —— 分卷策略：压缩后归档超过 1.5 GiB 则拆分，每卷 ≤ 1.5 GiB（< 2 GiB 上限）——
          PARTS=()
          SZ=$(stat -c%s "$ARCHIVE")
          SPLIT_LIMIT=$((1500*1024*1024))   # 1.5 GiB
          if [ "$SZ" -gt "$SPLIT_LIMIT" ]; then
            echo "归档体积 $((SZ/1024/1024))MB 超过 1.5GiB，拆分为多卷（每卷 1.5GiB，< 2GiB 上限）"
            OUTPREF="${ARCHIVE}.part"
            split -b 1500M -d -a 2 "$ARCHIVE" "$OUTPREF"
            rm -f "$ARCHIVE"
            shopt -s nullglob
            for p in "${OUTPREF}"*; do PARTS+=("$p"); done
            shopt -u nullglob
          else
            PARTS=("$ARCHIVE")
          fi
          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo "::error:: 归档分卷生成失败"
            exit 1
          fi

          # —— 幂等护栏：同一 ISO 周内重跑（手动 / 定时并发 / 重试）时，先彻底删除旧
          #     Release 与 tag，再重建，保证每周仅一份最新备份，且不会因“标签已存在”
          #     而导致工作流失败（exit 1）。
          # 根因：GitHub Releases API 删除后存在最终一致窗口；旧实现仅靠
          #     `gh release delete ... || true` 吞错，未校验删除是否真正生效，紧接的
          #     `gh release create` 偶发 “a release with the same tag name already exists”。
          delete_existing() {
            local t="$1"
            # 1) 删除 Release（含其 tag）
            gh release delete "$t" --yes --delete-tag >/dev/null 2>&1 || true
            # 2) 双重保险：直接删除远端 git tag（覆盖“仅存在 tag、无 Release”的边界）
            git push origin ":refs/tags/$t" >/dev/null 2>&1 || true
            # 3) 轮询校验 Release 确已消失（最多 6 次，间隔 5s，约 30s），吸收一致窗口
            local i=0
            while gh release view "$t" >/dev/null 2>&1 && [ "$i" -lt 6 ]; do
              echo "等待 Release $t 删除生效 ($((i+1))/6)..."
              sleep 5
              i=$((i+1))
            done
            # 4) 若 Release 已删但 tag 仍残留（极端一致窗口），再删一次
            if git ls-remote --tags origin "refs/tags/$t" | grep -q "$t"; then
              git push origin ":refs/tags/$t" >/dev/null 2>&1 || true
            fi
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "检测到本周已存在 Release $TAG，先删除再重建（最新一次运行获胜）..."
            delete_existing "$TAG"
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "检测到本周已存在 tag $TAG（无 Release），删除后重建..."
            git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
          fi

          # 多卷时给出还原说明
          REASM=""
          if [ "${#PARTS[@]}" -gt 1 ]; then
            REASM=$'\n本归档为多卷分卷：下载全部 part* 后执行 `cat full-backup-*.tar.gz.part* > combined.tar.gz` 再 `tar -xzf combined.tar.gz` 还原。'
          fi

          create_release() {
            gh release create "$TAG" "${PARTS[@]}" \
              --title "周级备份 ${TAG}（生成于 ${TS}）" \
              --notes "自动归档：整站完整快照（含 xianbao/ 镜像产物）。
          生成时间（北京时间）：${TS}
          内容：mirror 抓取脚本、配置、xianbao/ 整站镜像（图片已本地化）。
          历史保留策略：保留全部周级历史快照（GitHub Release 永久保存，不主动清理旧备份）。${REASM}"
          }
          n=0
          until create_release; do
            n=$((n+1)); [ "$n" -ge 5 ] && { echo "::error:: 周级备份创建失败（已重试 $n 次）"; exit 1; }
            echo "创建遇冲突，等待后重试 ($n/5)..."
            sleep 10
          done
          echo "周级备份已发布: $TAG"
