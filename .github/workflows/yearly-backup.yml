name: 年度备份 · Release 归档

# 每年1月1日将「整站（含 xianbao/ 镜像）」整体打包为 GitHub Release（tag 形如 backup-YYYY）。
# 仅做归档，不重新渲染（镜像内容由每日 backup.yml 增量维护）。
# 恢复粒度 = 年级；历史保留 = 全部（永久），与 qke.net 策略一致（GitHub Release assets
#   永不过期、不计入 Packages 500MB 配额、不随仓库不活动而删）。
# 分卷策略：GitHub Release 单文件上限 < 2 GiB；压缩后归档超过 1.5 GiB 自动拆分为
#   多卷（每卷 ≤ 1.5 GiB），多卷经 `cat <tag>.tar.gz.part* > combined.tar.gz` 再解压还原。

on:
  schedule:
    - cron: "0 18 1 1 *"   # 北京时间每年1月1日 02:00（UTC 1月1日 18:00）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: yearly-backup
  cancel-in-progress: false

jobs:
  yearly-backup:
    runs-on: ubuntu-latest
    env:
      PAGES_PREFIX: "/"
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 整站打包（含 xianbao/，超 1.5GiB 自动分卷）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="backup-$(TZ=Asia/Shanghai date +%Y)"
          TS="$(TZ=Asia/Shanghai date +%F)"
          ARCHIVE="${RUNNER_TEMP:-/tmp}/full-backup-${TAG}.tar.gz"
          tar --exclude='.git' --exclude='__pycache__' --exclude='backups' \
              --exclude='*.pyc' --exclude='*.tar.gz' -czf "$ARCHIVE" .

          PARTS=()
          SZ=$(stat -c%s "$ARCHIVE")
          SPLIT_LIMIT=$((1500*1024*1024))   # 1.5 GiB
          if [ "$SZ" -gt "$SPLIT_LIMIT" ]; then
            echo "归档体积 $((SZ/1024/1024))MB 超过 1.5GiB，拆分为多卷（每卷 1.5GiB，< 2GiB 上限）"
            OUTPREF="${ARCHIVE}.part"
            split -b 1500M -d -a 2 "$ARCHIVE" "$OUTPREF"
            rm -f "$ARCHIVE"
            shopt -s nullglob
            for p in "${OUTPREF}"*; do PARTS+=("$p"); done
            shopt -u nullglob
          else
            PARTS=("$ARCHIVE")
          fi
          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo "::error:: 归档分卷生成失败"
            exit 1
          fi

          delete_existing() {
            local t="$1"
            gh release delete "$t" --yes --delete-tag >/dev/null 2>&1 || true
            git push origin ":refs/tags/$t" >/dev/null 2>&1 || true
            local i=0
            while gh release view "$t" >/dev/null 2>&1 && [ "$i" -lt 6 ]; do
              echo "等待 Release $t 删除生效 ($((i+1))/6)..."
              sleep 5
              i=$((i+1))
            done
            if git ls-remote --tags origin "refs/tags/$t" | grep -q "$t"; then
              git push origin ":refs/tags/$t" >/dev/null 2>&1 || true
            fi
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "检测到本年已存在 Release $TAG，先删除再重建（最新一次运行获胜）..."
            delete_existing "$TAG"
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "检测到本年已存在 tag $TAG（无 Release），删除后重建..."
            git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
          fi

          REASM=""
          if [ "${#PARTS[@]}" -gt 1 ]; then
            REASM=$'\n本归档为多卷分卷：下载全部 part* 后执行 `cat full-backup-*.tar.gz.part* > combined.tar.gz` 再 `tar -xzf combined.tar.gz` 还原。'
          fi

          create_release() {
            gh release create "$TAG" "${PARTS[@]}" \
              --title "年度备份 ${TAG}（生成于 ${TS}）" \
              --notes "自动归档：整站完整快照（含 xianbao/ 镜像产物）。
          生成时间（北京时间）：${TS}
          内容：mirror 抓取脚本、配置、xianbao/ 整站镜像（图片已本地化）。
          历史保留策略：保留全部年级历史快照（GitHub Release 永久保存，不主动清理旧备份）。${REASM}"
          }
          n=0
          until create_release; do
            n=$((n+1)); [ "$n" -ge 5 ] && { echo "::error:: 年度备份创建失败（已重试 $n 次）"; exit 1; }
            echo "创建遇冲突，等待后重试 ($n/5)..."
            sleep 10
          done
          echo "年度备份已发布: $TAG"
