name: 年度备份 · Release 归档

# 每年1月1日打包「当前仓库快照」为 GitHub Release（tag 形如 backup-YYYY）。
# 仅做归档，不重新渲染（镜像内容由每日 backup.yml 增量维护）。
# 恢复粒度 = 年级；历史保留 = 全部（永久）。GitHub Release assets 永不过期、
# 不计入 Packages 500MB 配额，故保留全部年级历史快照，不主动删旧（与 qke.net 一致）。

on:
  schedule:
    - cron: "0 18 1 1 *"   # 北京时间每年1月1日 02:00（UTC 1月1日 18:00）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: yearly-backup
  cancel-in-progress: false

jobs:
  yearly-backup:
    runs-on: ubuntu-latest
    env:
      PAGES_PREFIX: "/"
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 打包归档（自适应体积，避免单份归档过大）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="backup-$(TZ=Asia/Shanghai date +%Y)"
          TS="$(TZ=Asia/Shanghai date +%F)"
          ARCHIVE="${RUNNER_TEMP:-/tmp}/yearly-backup-${TAG}.tar.gz"
          tar --exclude='.git' --exclude='__pycache__' --exclude='backups' \
              --exclude='*.pyc' --exclude='*.tar.gz' -czf "$ARCHIVE" .
          SIZE=$(stat -c%s "$ARCHIVE" 2>/dev/null || echo 0)
          LIMIT=$((450*1024*1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "归档体积 $((SIZE/1024/1024))MB 超过 ${LIMIT} 字节限制，改为仅打包代码与配置"
            echo "（xianbao/ 镜像内容已完整留存于每日 git 提交历史，可由对应日期提交恢复）"
            tar --exclude='.git' --exclude='__pycache__' --exclude='backups' \
                --exclude='xianbao' --exclude='*.pyc' --exclude='*.tar.gz' \
                -czf "$ARCHIVE" .
            echo "本归档仅含 mirror/ 脚本与配置；镜像内容请由对应日期的 git 提交恢复。" > xianbao-EXCLUDED.txt
          fi

          delete_existing() {
            local t="$1"
            gh release delete "$t" --yes --delete-tag >/dev/null 2>&1 || true
            git push origin ":refs/tags/$t" >/dev/null 2>&1 || true
            local i=0
            while gh release view "$t" >/dev/null 2>&1 && [ "$i" -lt 6 ]; do
              echo "等待 Release $t 删除生效 ($((i+1))/6)..."
              sleep 5
              i=$((i+1))
            done
            if git ls-remote --tags origin "refs/tags/$t" | grep -q "$t"; then
              git push origin ":refs/tags/$t" >/dev/null 2>&1 || true
            fi
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "检测到本年已存在 Release $TAG，先删除再重建（最新一次运行获胜）..."
            delete_existing "$TAG"
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "检测到本年已存在 tag $TAG（无 Release），删除后重建..."
            git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
          fi

          create_release() {
            gh release create "$TAG" "$ARCHIVE" \
              --title "年度备份 ${TAG}（生成于 ${TS}）" \
              --notes "自动归档快照（tag=${TAG}）。
          生成时间（北京时间）：${TS}
          内容：mirror 抓取脚本、配置文件；xianbao/ 镜像内容随每日提交留存于 git 历史。
          若归档体积超限，仅打包代码与配置，镜像内容可由对应日期的 git 提交恢复。
          历史保留策略：保留全部年级历史快照（GitHub Release 永久保存，不主动清理旧备份）。"
          }
          n=0
          until create_release; do
            n=$((n+1)); [ "$n" -ge 5 ] && { echo "::error:: 年度备份创建失败（已重试 $n 次）"; exit 1; }
            echo "创建遇冲突，等待后重试 ($n/5)..."
            sleep 10
          done
          echo "年度备份已发布: $TAG"
