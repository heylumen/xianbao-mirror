<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  body { background:#f5f6f7; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .e404-wrap { max-width: 720px; margin: 0 auto; padding: 48px 16px; text-align: center; }

  .e404-btns { margin: 18px 0 28px; }
  .e404-btns a {

    margin: 6px 10px 6px 0; padding: 11px 18px; border-radius: 8px;
    background: #e63946; color: #fff; font-size: 15px; text-decoration: none;
    transition: background .15s ease;

  .e404-btns a:hover { background: #c1121f; }
