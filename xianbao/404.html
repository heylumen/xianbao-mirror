<style>

  .e404-wrap { max-width: 720px; margin: 0 auto; padding: 48px 16px; text-align: center; }

    display: inline-block; min-width: 132px; text-align: center;
    margin: 6px 10px 6px 0; padding: 11px 18px; border-radius: 8px;
    background: #e63946; color: #fff; font-size: 15px; text-decoration: none;

  .e404-search { margin: 22px auto 8px; max-width: 460px; display: flex; gap: 8px; }

    flex: 1; padding: 11px 14px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 15px; outline: none;
  }
  .e404-search input:focus { border-color: #e63946; }
  .e404-search button {
    padding: 11px 18px; border: 0; border-radius: 8px; background: #e63946;
    color: #fff; font-size: 15px; cursor: pointer;
  }
  .e404-search button:hover { background: #c1121f; }
  .e404-cats { margin: 14px 0 4px; font-size: 14px; color: #555; }
  .e404-cats a { color: #e63946; text-decoration: none; margin: 0 8px; }
  .e404-cats a:hover { text-decoration: underline; }
